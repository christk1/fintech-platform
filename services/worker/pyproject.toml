[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "boto3",
  "grpcio>=1.64.0",
  "protobuf>=5.0.0",
  "SQLAlchemy>=2.0.0",
  "pg8000>=1.31.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp>=1.25.0",
  "opentelemetry-instrumentation-logging>=0.46b0",
]

[project.scripts]
worker = "worker.interfaces.sqs.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

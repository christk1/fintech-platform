[project]
name = "api-gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]==0.128.0",
  "aioboto3>=13.0.0",
  "pydantic>=2.8.0",
]

[project.scripts]
api-gateway = "api_gateway.interfaces.http.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

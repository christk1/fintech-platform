[project]
name = "api-gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]==0.128.0",
  "boto3",
  "pydantic>=2.8.0",
  "grpcio>=1.64.0",
  "grpcio-tools>=1.64.0",
  "protobuf>=5.0.0",
  "SQLAlchemy>=2.0.0",
  "alembic>=1.13.0",
  "pg8000>=1.31.0",
]

[project.scripts]
api-gateway = "api_gateway.interfaces.http.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fintech
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: fintech/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: fintech-env
          env:
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            # In Kubernetes, balance-service is reachable by Service DNS.
            - name: BALANCE_SERVICE_GRPC_TARGET
              value: balance-service:50051
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fintech
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
  type: LoadBalancer

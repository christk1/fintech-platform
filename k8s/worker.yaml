apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fintech
spec:
  replicas: 5
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: fintech/worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: fintech-env
          env:
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
